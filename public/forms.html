<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>CupSpace form definitions</title>
  </head>
  <body>
    <!-- Unlinked form blueprints used by Netlify's deploy-time form detection. -->
    <form name="cafe-form" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="cafe-form" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="cafeName" />
      <input name="role" />
      <input name="address" />
      <input name="suburb" />
      <input name="state" />
      <input name="postcode" />
      <input name="exactLongitude" />
      <input name="exactLatitude" />
      <input name="dailyCups" />
      <input name="openHours" />
      <input name="currentSupplier" />
      <input name="monthlyCost" />
      <textarea name="customerBase"></textarea>
      <textarea name="goals"></textarea>
      <input name="timeline" />
      <input name="publicListingConsent" />
    </form>

    <form name="advertiser-form" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="advertiser-form" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="company" />
      <input name="industry" />
      <input name="budget" />
      <input name="timeline" />
      <input name="requestType" />
      <input name="locationId" />
      <input name="requestedLocation" />
      <input name="locations" />
      <textarea name="goals"></textarea>
      <textarea name="message"></textarea>
    </form>

    <form name="contact-form" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-form" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="company" />
      <input name="interest" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
